# «Пораскинем мозгами?» на brain.burninghouse.ru, стандартный порт 443.
# Кладётся в /etc/nginx/sites-available/brain и линкуется в sites-enabled.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name brain.burninghouse.ru;

    ssl_certificate     /etc/letsencrypt/live/brain.burninghouse.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brain.burninghouse.ru/privkey.pem;

    # Статика без загрузок — дефолтного client_max_body_size хватает с запасом.

    location / {
        proxy_pass http://127.0.0.1:8795;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name brain.burninghouse.ru;
    return 301 https://$host$request_uri;
}
