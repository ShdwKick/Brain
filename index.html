<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Пораскинем мозгами? — BurningHouse</title>
<!-- Публичная страница, вход не нужен — в отличие от Trip/Movies, тут
     действительно есть что индексировать: сама страница целиком и есть
     инструмент, не просто форма входа. index,follow — явно, тем же приёмом,
     что у Финансы/calculator.html. (Вход через общий аккаунт BurningHouse
     всё же есть — опционально, ради результатов друзей, см. assets/app.js.) -->
<meta name="robots" content="index, follow">
<meta name="description" content="Четырнадцать коротких упражнений на память, внимание, счёт и гибкость мышления. Без регистрации — просто разминка.">
<link rel="canonical" href="https://brain.burninghouse.ru/">

<!-- Open Graph / Twitter — без этого ссылка в поиске и при пересылке в
     мессенджеры разворачивается голым текстом (см. тот же приём у Home). -->
<meta property="og:type" content="website">
<meta property="og:locale" content="ru_RU">
<meta property="og:url" content="https://brain.burninghouse.ru/">
<meta property="og:site_name" content="BurningHouse">
<meta property="og:title" content="Пораскинем мозгами? — BurningHouse">
<meta property="og:description" content="Четырнадцать коротких упражнений на память, внимание, счёт и гибкость мышления. Без регистрации — просто разминка.">
<meta property="og:image" content="https://brain.burninghouse.ru/assets/icons/icon-512.png">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Пораскинем мозгами? — BurningHouse">
<meta name="twitter:description" content="Четырнадцать коротких упражнений на память, внимание, счёт и гибкость мышления. Без регистрации — просто разминка.">
<meta name="twitter:image" content="https://brain.burninghouse.ru/assets/icons/icon-512.png">

<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<link rel="manifest" href="assets/manifest.webmanifest">
<meta name="theme-color" content="#120a13">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/brand.css">
<link rel="stylesheet" href="assets/styles.css">

<!-- JSON-LD: у каждого упражнения теперь свой URL и свои <title>/description
     (см. server.js: seo-routes.js), но featureList всё равно перечисляет все
     14 названий разом на уровне всего приложения — так понятно, что это за
     набор инструментов, даже если поисковик дойдёт только до "/". -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "Пораскинем мозгами?",
  "alternateName": "BurningHouse Brain",
  "url": "https://brain.burninghouse.ru/",
  "description": "Четырнадцать коротких упражнений на память, внимание, счёт и гибкость мышления. Без регистрации — просто разминка.",
  "inLanguage": "ru",
  "isAccessibleForFree": true,
  "applicationCategory": "EducationalApplication",
  "operatingSystem": "Any",
  "offers": { "@type": "Offer", "price": "0", "priceCurrency": "RUB" },
  "featureList": [
    "N-back", "Dual n-back", "Corsi tapping", "Парная память",
    "Таблицы Шульте", "Струп-тест", "Trail Making", "Скорость реакции",
    "Мысленное вращение", "Ханойская башня",
    "Анаграммы", "Категории на скорость",
    "Переключение правил", "Устный счёт"
  ]
}
</script>
</head>
<body>

<!-- Горящий дом за интерфейсом. Вариант «Очаг» + своя повадка искр (нейроны
     срабатывают на месте, а не летят) — см. Design/motion.md и bh-sparks--flicker
     в Shared/brand.css. Луч, гуляющий по комнате слева направо, заменён на
     волну импульса от очага (bh-sweep--pulse, локально в assets/styles.css) —
     это уже не свет, идущий мимо, а сигнал, расходящийся наружу. -->
<div class="bh-backdrop bh-backdrop--page" id="backdrop" aria-hidden="true">
  <div class="bh-layer"><div class="bh-glow"></div></div>
  <div class="bh-layer"><div class="bh-sweep bh-sweep--pulse"></div></div>
  <div class="bh-layer"><div class="bh-haze"></div></div>
  <div class="bh-layer bh-sparks bh-sparks--flicker" data-bh-sparks="10"></div>
</div>

<div class="topbar">
  <div class="bh-lockup">
    <a class="bh-lockup-home" href="https://burninghouse.ru" aria-label="BurningHouse — каталог сервисов">
      <svg class="bh-mark" viewBox="0 0 24 24" role="img" aria-hidden="true">
        <defs>
          <linearGradient id="bhFlameBrain" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0" stop-color="var(--flame-base, #9d174d)"/>
            <stop offset="1" stop-color="var(--flame-tip, #ff5c8a)"/>
          </linearGradient>
        </defs>
        <path class="bh-flame" fill="url(#bhFlameBrain)" fill-rule="evenodd"
              d="M12 1.2C13.6 5 16.4 6.6 18.2 9.4C21.4 14.4 18.6 22.4 12 22.4C5.4 22.4 2.6 14.4 5.8 9.4C7.2 7.2 9.2 6 10.2 3.4C10.9 5.6 11.4 6.6 12 7.4C12.4 5.6 12.3 3.4 12 1.2ZM12 9.8 7.4 13.6V19.2H16.6V13.6Z"/>
      </svg>
      <span class="bh-name">BurningHouse</span>
    </a>
    <span class="bh-sep" aria-hidden="true"></span>
    <a class="bh-lockup-service" href="/" aria-label="Пораскинем мозгами? — на главную сервиса">
      <span class="bh-service">Пораскинем мозгами?</span>
    </a>
  </div>
  <div class="topbar-actions">
    <button class="icon-btn is-hidden" id="installBtn" type="button" title="Установить" aria-label="Установить">
      <svg class="icon" viewBox="0 0 24 24"><path d="M12 3v12m0 0l-5-5m5 5l5-5M5 19h14"/></svg>
    </button>
    <button class="icon-btn" id="quietBtn" type="button" title="Приглушить фон" aria-label="Приглушить фон">
      <svg class="icon" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
    <button class="icon-btn" id="soundBtn" type="button" title="Звук" aria-label="Звук"></button>
    <button class="icon-btn" id="themeBtn" type="button" title="Сменить тему" aria-label="Сменить тему"></button>
    <!-- Скрыта, пока assets/app.js не подтвердит, что вход вообще доступен
         (см. initAuth) — так же, как installBtn выше. -->
    <button class="icon-btn is-hidden" id="authBtn" type="button" title="Войти через аккаунт BurningHouse" aria-label="Войти через аккаунт BurningHouse">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
    </button>
  </div>
</div>

<main id="view" aria-live="polite"></main>

<p class="foot">Пораскинем мозгами? · BurningHouse</p>

<script src="assets/brand.js"></script>
<!-- Копия Auth/client/auth-client-browser.js — не редактировать здесь, см.
     Auth/INTEGRATION.md. Обычный скрипт, не модуль: createAuthClient должен
     быть глобалью к моменту, когда его вызовет initAuth() в app.js. -->
<script src="assets/auth-client.js"></script>
<script type="module" src="assets/app.js"></script>
</body>
</html>
